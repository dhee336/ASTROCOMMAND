.fl2{animation:fl 5s ease-in-out infinite reverse}
.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sp{animation:sp 24s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
.wv{animation:wv 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}@keyframes wv{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.dash{animation:dash 1.5s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.t{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
