<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four Academy missions">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060a1f"/><stop offset="1" stop-color="#161c4d"/></linearGradient>
<radialGradient id="earth" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#6ec6ff"/><stop offset="0.6" stop-color="#2b7be0"/><stop offset="1" stop-color="#16408f"/></radialGradient>
<radialGradient id="moon" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f1f3fa"/><stop offset="0.7" stop-color="#b6bcd0"/><stop offset="1" stop-color="#7d8499"/></radialGradient>
<radialGradient id="mars" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ff9a6b"/><stop offset="0.65" stop-color="#d9532b"/><stop offset="1" stop-color="#8e2f16"/></radialGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6b0"/><stop offset="0.5" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff8a1f"/></radialGradient>
<linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a8f"/><stop offset="1" stop-color="#101746"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#b79cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>

</defs>
<style>
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.fl2{animation:fl 5s ease-in-out infinite reverse}
.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sp{animation:sp 24s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
.wv{animation:wv 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}@keyframes wv{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.dash{animation:dash 1.5s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.t{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
